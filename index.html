<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Przyjęcia towaru</title>
<meta name="description" content="Rejestr towaru przychodzącego do firmy">
<meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Przyjęcia">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<style>
  :root {
    --bg: #F2F2F7;
    --card: #FFFFFF;
    --text: #1C1C1E;
    --muted: #8A8A8E;
    --line: rgba(60, 60, 67, .14);
    --field: #F2F2F7;
    --accent: #C8102E;
    --accent-press: #A20C25;
    --accent-soft: rgba(200, 16, 46, .10);
    --ok: #1E8E4E;
    --warn: #B86E00;
    --overlay: rgba(0, 0, 0, .35);
    --shadow: 0 1px 2px rgba(0,0,0,.04), 0 6px 20px rgba(0,0,0,.05);
    color-scheme: light dark;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #000000;
      --card: #1C1C1E;
      --text: #F2F2F7;
      --muted: #98989F;
      --line: rgba(84, 84, 88, .55);
      --field: #2C2C2E;
      --accent: #F0354A;
      --accent-press: #D02238;
      --accent-soft: rgba(240, 53, 74, .18);
      --ok: #30D158;
      --warn: #FFB340;
      --overlay: rgba(0, 0, 0, .6);
      --shadow: none;
    }
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 17px/1.35 -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, "Segoe UI", Roboto, sans-serif;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    min-height: 100vh;
  }
  button, input { font: inherit; color: inherit; }
  button { cursor: pointer; border: 0; background: none; padding: 0; }
  .wrap { max-width: 560px; margin: 0 auto; padding: 0 16px 48px; }

  /* Nagłówek */
  header { display: flex; align-items: flex-end; justify-content: space-between; padding: 14px 0 12px; }
  h1 { font-size: 32px; line-height: 1.1; font-weight: 700; letter-spacing: -.02em; margin: 0; }
  .today { color: var(--muted); font-size: 15px; margin-top: 4px; }
  .icon-btn {
    width: 40px; height: 40px; border-radius: 20px; display: grid; place-items: center;
    background: var(--card); box-shadow: var(--shadow); color: var(--accent);
  }
  .icon-btn svg { width: 22px; height: 22px; }

  /* Karta dodawania */
  .card { background: var(--card); border-radius: 16px; box-shadow: var(--shadow); padding: 14px; }
  .lbl { display: block; font-size: 13px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; margin: 2px 2px 6px; }
  .field {
    width: 100%; height: 50px; border-radius: 12px; border: 1.5px solid transparent;
    background: var(--field); padding: 0 14px; font-size: 18px; outline: none;
    -webkit-appearance: none; appearance: none;
  }
  .field:focus { border-color: var(--accent); background: var(--card); }
  .field.invalid { border-color: var(--accent); animation: shake .3s; }
  @keyframes shake { 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }

  .name-wrap { position: relative; }
  .sugs {
    list-style: none; margin: 6px 0 0; padding: 4px 0; border-radius: 12px;
    background: var(--card); border: 1px solid var(--line); box-shadow: 0 8px 28px rgba(0,0,0,.12);
    position: absolute; left: 0; right: 0; top: 100%; z-index: 20; max-height: 300px; overflow-y: auto;
  }
  .sugs[hidden] { display: none; }
  .sug { display: flex; align-items: center; min-height: 48px; border-bottom: 1px solid var(--line); }
  .sug:last-child { border-bottom: 0; }
  .sug-pick { flex: 1; text-align: left; padding: 10px 6px 10px 14px; display: flex; align-items: baseline; gap: 8px; min-width: 0; }
  .sug-pick .n { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sug-pick mark { background: none; color: var(--accent); font-weight: 600; }
  .sug-pick .u { color: var(--muted); font-size: 14px; flex-shrink: 0; }
  .sug-del { width: 44px; height: 44px; color: var(--muted); font-size: 22px; line-height: 1; flex-shrink: 0; }
  .sug-head { padding: 6px 14px 4px; font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); border-bottom: 1px solid var(--line); }

  .row { display: flex; gap: 10px; margin-top: 12px; align-items: flex-end; }
  .qty-col { flex: 0 0 38%; }
  .unit-col { flex: 1; }
  .seg { display: flex; height: 50px; background: var(--field); border-radius: 12px; padding: 3px; gap: 3px; }
  .seg button { flex: 1; border-radius: 9px; font-size: 17px; font-weight: 600; color: var(--muted); transition: background .15s, color .15s; }
  .seg button[aria-checked="true"] { background: var(--card); color: var(--text); box-shadow: 0 1px 4px rgba(0,0,0,.14); }
  @media (prefers-color-scheme: dark) { .seg button[aria-checked="true"] { background: #48484A; } }

  .btn-primary {
    width: 100%; height: 52px; margin-top: 14px; border-radius: 13px; background: var(--accent); color: #fff;
    font-size: 18px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 8px;
  }
  .btn-primary:active { background: var(--accent-press); }

  /* Wyszukiwarka */
  .search { position: relative; margin: 22px 0 6px; }
  .search svg { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); width: 18px; height: 18px; color: var(--muted); pointer-events: none; }
  .search input { width: 100%; height: 42px; border-radius: 11px; border: 0; background: rgba(118,118,128,.12); padding: 0 40px 0 38px; font-size: 17px; outline: none; -webkit-appearance: none; }
  .search .clear { position: absolute; right: 4px; top: 50%; transform: translateY(-50%); width: 36px; height: 36px; color: var(--muted); font-size: 20px; }
  .search .clear[hidden] { display: none; }
  .search-info { font-size: 14px; color: var(--muted); margin: 8px 4px 0; }

  /* Lista dni */
  .day { margin-top: 22px; }
  .day-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 10px; margin: 0 4px 8px; }
  .day-title { font-size: 20px; font-weight: 700; letter-spacing: -.01em; }
  .day-sub { font-size: 14px; color: var(--muted); margin-top: 1px; }
  .day-sub .ok { color: var(--ok); }
  .day-sub .warn { color: var(--warn); }
  .day-actions { display: flex; gap: 8px; flex-shrink: 0; }
  .btn-copy {
    height: 36px; padding: 0 14px; border-radius: 18px; background: var(--accent-soft); color: var(--accent);
    font-size: 15px; font-weight: 600; display: flex; align-items: center; gap: 6px;
  }
  .btn-copy svg { width: 16px; height: 16px; }
  .btn-copy.done { background: rgba(30,142,78,.14); color: var(--ok); }
  .btn-share { width: 36px; height: 36px; border-radius: 18px; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; }
  .btn-share svg { width: 18px; height: 18px; }

  .items { list-style: none; margin: 0; padding: 0; background: var(--card); border-radius: 14px; box-shadow: var(--shadow); overflow: hidden; }
  .item { display: flex; align-items: center; gap: 10px; width: 100%; min-height: 52px; padding: 10px 12px 10px 16px; text-align: left; position: relative; }
  .item:active { background: var(--field); }
  .items li + li .item::before { content: ""; position: absolute; top: 0; left: 16px; right: 0; border-top: 1px solid var(--line); }
  .item-name { flex: 1; min-width: 0; overflow-wrap: anywhere; }
  .item-qty { font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .item-qty small { font-weight: 500; color: var(--muted); font-size: 15px; }
  .chev { width: 8px; height: 13px; color: var(--muted); opacity: .6; flex-shrink: 0; }

  .empty { text-align: center; color: var(--muted); padding: 40px 20px; font-size: 16px; }
  .more { display: block; margin: 22px auto 0; height: 40px; padding: 0 18px; border-radius: 20px; background: var(--card); box-shadow: var(--shadow); color: var(--accent); font-weight: 600; font-size: 15px; }

  /* Arkusze (edycja, menu) */
  .overlay { position: fixed; inset: 0; background: var(--overlay); z-index: 50; display: flex; align-items: flex-end; justify-content: center; opacity: 0; transition: opacity .2s; }
  .overlay.open { opacity: 1; }
  .overlay[hidden] { display: none; }
  .sheet {
    width: 100%; max-width: 560px; background: var(--bg); border-radius: 18px 18px 0 0;
    padding: 8px 16px calc(20px + env(safe-area-inset-bottom)); transform: translateY(100%); transition: transform .25s cubic-bezier(.2,.8,.2,1);
    max-height: 92vh; overflow-y: auto;
  }
  .overlay.open .sheet { transform: none; }
  .grabber { width: 36px; height: 5px; border-radius: 3px; background: var(--muted); opacity: .4; margin: 0 auto 10px; }
  .sheet-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  .sheet-head h2 { font-size: 17px; font-weight: 600; margin: 0; }
  .link-btn { color: var(--accent); font-size: 17px; padding: 6px 2px; }
  .link-btn.strong { font-weight: 600; }
  .sheet .card + .card { margin-top: 12px; }
  .field-date { display: flex; align-items: center; }
  .btn-danger { width: 100%; height: 50px; margin-top: 14px; border-radius: 13px; background: var(--card); color: #E5242F; font-weight: 600; box-shadow: var(--shadow); }
  @media (prefers-color-scheme: dark) { .btn-danger { color: #FF453A; } }

  .menu-list { list-style: none; margin: 0; padding: 0; background: var(--card); border-radius: 14px; overflow: hidden; box-shadow: var(--shadow); }
  .menu-list li + li { border-top: 1px solid var(--line); }
  .menu-list button { width: 100%; text-align: left; padding: 14px 16px; display: flex; gap: 12px; align-items: center; }
  .menu-list svg { width: 22px; height: 22px; color: var(--accent); flex-shrink: 0; }
  .menu-note { color: var(--muted); font-size: 14px; margin: 12px 6px 0; line-height: 1.45; }

  /* Komunikat */
  .toast {
    position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom)); transform: translate(-50%, 20px);
    background: rgba(30,30,32,.94); color: #fff; padding: 12px 18px; border-radius: 14px; font-size: 15px; font-weight: 500;
    opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; z-index: 80; width: max-content; max-width: calc(100% - 32px); text-align: center;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }
  .vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>Przyjęcia towaru</h1>
      <div class="today" id="todayLabel"></div>
    </div>
    <button class="icon-btn" id="menuBtn" aria-label="Menu">
      <svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg>
    </button>
  </header>

  <form class="card" id="addForm" autocomplete="off" novalidate>
    <label class="lbl" for="nameInput">Towar</label>
    <div class="name-wrap">
      <input class="field" id="nameInput" type="text" placeholder="Wpisz nazwę…" enterkeyhint="next"
             autocomplete="off" autocorrect="off" spellcheck="false" autocapitalize="sentences"
             role="combobox" aria-autocomplete="list" aria-controls="sugList" aria-expanded="false">
      <ul class="sugs" id="sugList" role="listbox" hidden></ul>
    </div>
    <div class="row">
      <div class="qty-col">
        <label class="lbl" for="qtyInput">Ilość</label>
        <input class="field" id="qtyInput" type="text" inputmode="decimal" placeholder="0" autocomplete="off" enterkeyhint="done">
      </div>
      <div class="unit-col">
        <span class="lbl" id="unitLbl">Jednostka</span>
        <div class="seg" role="radiogroup" aria-labelledby="unitLbl" id="unitSeg"></div>
      </div>
    </div>
    <button class="btn-primary" type="submit">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      Dodaj
    </button>
  </form>

  <div class="search">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input id="searchInput" type="search" placeholder="Szukaj pozycji" aria-label="Szukaj pozycji" autocomplete="off" autocorrect="off" spellcheck="false" enterkeyhint="search">
    <button class="clear" id="searchClear" aria-label="Wyczyść" hidden>✕</button>
  </div>
  <div class="search-info" id="searchInfo" hidden></div>

  <main id="list"></main>
</div>

<!-- Edycja pozycji -->
<div class="overlay" id="editOverlay" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="editTitle">
    <div class="grabber"></div>
    <div class="sheet-head">
      <button class="link-btn" id="editCancel" type="button">Anuluj</button>
      <h2 id="editTitle">Edytuj pozycję</h2>
      <button class="link-btn strong" id="editSave" type="button">Zapisz</button>
    </div>
    <div class="card">
      <label class="lbl" for="editName">Towar</label>
      <input class="field" id="editName" type="text" autocomplete="off" autocorrect="off" spellcheck="false">
      <div class="row">
        <div class="qty-col">
          <label class="lbl" for="editQty">Ilość</label>
          <input class="field" id="editQty" type="text" inputmode="decimal" autocomplete="off">
        </div>
        <div class="unit-col">
          <span class="lbl" id="editUnitLbl">Jednostka</span>
          <div class="seg" role="radiogroup" aria-labelledby="editUnitLbl" id="editUnitSeg"></div>
        </div>
      </div>
      <div style="margin-top:12px">
        <label class="lbl" for="editDate">Data odbioru</label>
        <input class="field field-date" id="editDate" type="date">
      </div>
    </div>
    <button class="btn-danger" id="editDelete" type="button">Usuń pozycję</button>
  </div>
</div>

<!-- Menu -->
<div class="overlay" id="menuOverlay" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="menuTitle">
    <div class="grabber"></div>
    <div class="sheet-head">
      <span style="width:60px"></span>
      <h2 id="menuTitle">Ustawienia</h2>
      <button class="link-btn strong" id="menuClose" type="button" style="width:60px;text-align:right">Gotowe</button>
    </div>
    <ul class="menu-list">
      <li><button id="exportBtn" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M7 8l5-5 5 5"/><path d="M5 13v6a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-6"/></svg>
        Zapisz kopię zapasową</button></li>
      <li><button id="importBtn" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V3M7 10l5 5 5-5"/><path d="M5 13v6a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-6"/></svg>
        Wczytaj kopię zapasową</button></li>
    </ul>
    <input type="file" id="importFile" accept="application/json,.json" class="vh" tabindex="-1">
    <p class="menu-note" id="statsNote"></p>
    <p class="menu-note">Dane są zapisane tylko na tym telefonie. Zrób kopię zapasową przed zmianą telefonu lub usunięciem aplikacji z ekranu początkowego.<br>Nieaktualną podpowiedź usuniesz przyciskiem ✕ na liście podpowiedzi.</p>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(() => {
  'use strict';

  const UNITS = ['szt.', 'mb', 'kpl.'];
  const STORE_KEY = 'przyjecia.v1';
  const DAYS_STEP = 14;
  const $ = (id) => document.getElementById(id);

  // ---------- Dane ----------
  function load() {
    try {
      const raw = localStorage.getItem(STORE_KEY);
      if (raw) {
        const s = JSON.parse(raw);
        if (s && Array.isArray(s.entries)) {
          return { entries: s.entries, dict: s.dict || {}, copied: s.copied || {} };
        }
      }
    } catch (e) { /* brak dostępu do pamięci */ }
    return { entries: [], dict: {}, copied: {} };
  }
  let state = load();
  function save() {
    try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); }
    catch (e) { toast('Nie udało się zapisać danych'); }
  }
  if (navigator.storage && navigator.storage.persist) { navigator.storage.persist().catch(() => {}); }

  // ---------- Pomocnicze ----------
  const fold = (s) => String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/ł/g, 'l');
  const norm = (s) => fold(s).replace(/\s+/g, ' ').trim();
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  const pad = (n) => String(n).padStart(2, '0');

  function isoOf(d) { return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; }
  const todayISO = () => isoOf(new Date());
  function fmtDate(iso) { const [y, m, d] = iso.split('-'); return `${d}.${m}.${y}`; }
  function dayName(iso) {
    const today = todayISO();
    const y = new Date(); y.setDate(y.getDate() - 1);
    if (iso === today) return 'Dziś';
    if (iso === isoOf(y)) return 'Wczoraj';
    const [yy, mm, dd] = iso.split('-').map(Number);
    const w = new Date(yy, mm - 1, dd).toLocaleDateString('pl-PL', { weekday: 'long' });
    return w.charAt(0).toUpperCase() + w.slice(1);
  }
  function fmtQty(n) { return String(Number(Number(n).toFixed(3))).replace('.', ','); }
  function parseQty(s) {
    const v = Number(String(s).replace(/\s/g, '').replace(',', '.'));
    return Number.isFinite(v) && v > 0 ? v : null;
  }
  function plural(n, one, few, many) {
    if (n === 1) return one;
    const d = n % 10, t = n % 100;
    return d >= 2 && d <= 4 && (t < 12 || t > 14) ? few : many;
  }
  function fmtTime(ts) { const d = new Date(ts); return `${pad(d.getHours())}:${pad(d.getMinutes())}`; }

  // ---------- Pamięć nazw (podpowiedzi) ----------
  function remember(name, unit, bump) {
    const k = norm(name);
    if (!k) return;
    const d = state.dict[k] || { name: name.trim(), count: 0 };
    d.name = name.trim();
    d.unit = unit;
    if (bump) d.count = (d.count || 0) + 1;
    d.last = Date.now();
    state.dict[k] = d;
  }
  function findSuggestions(query) {
    const q = norm(query);
    const all = Object.entries(state.dict);
    const byUse = (a, b) => (b[1].count || 0) - (a[1].count || 0) || (b[1].last || 0) - (a[1].last || 0);
    if (!q) return all.sort(byUse).slice(0, 6);
    const toks = q.split(' ');
    return all
      .filter(([k]) => k !== q && toks.every((t) => k.includes(t)))
      .map(([k, d]) => [k, d, k.startsWith(q) ? 0 : k.includes(' ' + toks[0]) ? 1 : 2])
      .sort((a, b) => a[2] - b[2] || byUse(a, b))
      .slice(0, 8);
  }
  function highlight(name, query) {
    const t = norm(query).split(' ')[0];
    if (!t) return esc(name);
    const i = fold(name).indexOf(t);
    if (i < 0) return esc(name);
    return esc(name.slice(0, i)) + '<mark>' + esc(name.slice(i, i + t.length)) + '</mark>' + esc(name.slice(i + t.length));
  }

  // ---------- Przełącznik jednostek ----------
  function buildSeg(el, onPick) {
    el.innerHTML = UNITS.map((u) => `<button type="button" role="radio" aria-checked="false" data-unit="${u}">${u}</button>`).join('');
    el.addEventListener('click', (e) => {
      const b = e.target.closest('button[data-unit]');
      if (b) onPick(b.dataset.unit, true);
    });
    return (unit) => el.querySelectorAll('button').forEach((b) => b.setAttribute('aria-checked', String(b.dataset.unit === unit)));
  }

  // ---------- Formularz dodawania ----------
  const nameInput = $('nameInput'), qtyInput = $('qtyInput'), sugList = $('sugList');
  let curUnit = 'szt.', unitTouched = false;
  const paintUnit = buildSeg($('unitSeg'), (u, byUser) => { curUnit = u; if (byUser) unitTouched = true; paintUnit(u); });
  paintUnit(curUnit);
  function setUnit(u) { if (UNITS.includes(u)) { curUnit = u; paintUnit(u); } }

  function showSuggestions() {
    const q = nameInput.value;
    const list = findSuggestions(q);
    if (!list.length) return hideSuggestions();
    const head = norm(q) ? '' : '<li class="sug-head">Najczęściej używane</li>';
    sugList.innerHTML = head + list.map(([k, d]) => `
      <li class="sug" role="option">
        <button type="button" class="sug-pick" data-key="${esc(k)}"><span class="n">${highlight(d.name, q)}</span><span class="u">${esc(d.unit || '')}</span></button>
        <button type="button" class="sug-del" data-del="${esc(k)}" aria-label="Usuń podpowiedź ${esc(d.name)}">×</button>
      </li>`).join('');
    sugList.hidden = false;
    nameInput.setAttribute('aria-expanded', 'true');
  }
  function hideSuggestions() {
    sugList.hidden = true;
    sugList.innerHTML = '';
    nameInput.setAttribute('aria-expanded', 'false');
  }

  nameInput.addEventListener('focus', showSuggestions);
  nameInput.addEventListener('input', () => {
    nameInput.classList.remove('invalid');
    const d = state.dict[norm(nameInput.value)];
    if (d && !unitTouched) setUnit(d.unit);
    showSuggestions();
  });
  nameInput.addEventListener('blur', () => setTimeout(hideSuggestions, 150));
  nameInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') { e.preventDefault(); qtyInput.focus(); }
    if (e.key === 'Escape') hideSuggestions();
  });
  // Nie zabieraj fokusu z pola przy dotknięciu listy
  sugList.addEventListener('pointerdown', (e) => e.preventDefault());
  sugList.addEventListener('mousedown', (e) => e.preventDefault());
  sugList.addEventListener('click', (e) => {
    const del = e.target.closest('[data-del]');
    if (del) {
      const d = state.dict[del.dataset.del];
      if (d && confirm(`Usunąć „${d.name}” z podpowiedzi?\nZapisane pozycje na liście zostaną.`)) {
        delete state.dict[del.dataset.del];
        save();
        showSuggestions();
      }
      return;
    }
    const pick = e.target.closest('[data-key]');
    if (pick) {
      const d = state.dict[pick.dataset.key];
      if (!d) return;
      nameInput.value = d.name;
      setUnit(d.unit);
      unitTouched = false;
      hideSuggestions();
      qtyInput.focus();
    }
  });
  qtyInput.addEventListener('input', () => {
    qtyInput.classList.remove('invalid');
    // tylko cyfry i jeden przecinek
    let v = qtyInput.value.replace('.', ',').replace(/[^\d,]/g, '');
    const i = v.indexOf(',');
    if (i >= 0) v = v.slice(0, i + 1) + v.slice(i + 1).replace(/,/g, '');
    if (v !== qtyInput.value) qtyInput.value = v;
  });

  function invalid(el) { el.classList.remove('invalid'); void el.offsetWidth; el.classList.add('invalid'); el.focus(); }

  $('addForm').addEventListener('submit', (e) => {
    e.preventDefault();
    const name = nameInput.value.trim().replace(/\s+/g, ' ');
    const qty = parseQty(qtyInput.value);
    if (!name) { invalid(nameInput); toast('Wpisz nazwę towaru'); return; }
    if (qty === null) { invalid(qtyInput); toast('Podaj ilość'); return; }
    const now = Date.now();
    state.entries.push({ id: uid(), name, qty, unit: curUnit, date: todayISO(), created: now, updated: now });
    remember(name, curUnit, true);
    save();
    nameInput.value = '';
    qtyInput.value = '';
    unitTouched = false;
    hideSuggestions();
    render();
    toast(`Dodano: ${name} – ${fmtQty(qty)} ${curUnit}`);
    nameInput.focus();
  });

  // ---------- Lista ----------
  const listEl = $('list'), searchInput = $('searchInput'), searchClear = $('searchClear'), searchInfo = $('searchInfo');
  let daysShown = DAYS_STEP;

  const icoCopy = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="11" height="11" rx="2.5"/><path d="M5 15V6a2 2 0 0 1 2-2h8"/></svg>';
  const icoShare = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M7 8l5-5 5 5"/><path d="M5 13v6a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-6"/></svg>';
  const chev = '<svg class="chev" viewBox="0 0 8 13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m1.5 1.5 5 5-5 5"/></svg>';
  const canShare = typeof navigator.share === 'function';

  function entriesOfDay(date) {
    return state.entries.filter((e) => e.date === date).sort((a, b) => a.created - b.created);
  }

  function copyStatus(date) {
    const c = state.copied[date];
    if (!c || !c.at) return '';
    return slackText(date) === c.text
      ? ` · <span class="ok">✓ skopiowano ${fmtTime(c.at)}</span>`
      : ` · <span class="warn">zmiany po skopiowaniu</span>`;
  }

  function render() {
    const q = norm(searchInput.value);
    searchClear.hidden = !searchInput.value;
    const toks = q ? q.split(' ') : [];
    const match = (e) => toks.every((t) => norm(e.name).includes(t));

    const byDate = new Map();
    for (const e of state.entries) {
      if (q && !match(e)) continue;
      if (!byDate.has(e.date)) byDate.set(e.date, []);
      byDate.get(e.date).push(e);
    }
    const dates = [...byDate.keys()].sort().reverse();

    if (q) {
      const n = dates.reduce((s, d) => s + byDate.get(d).length, 0);
      searchInfo.hidden = false;
      searchInfo.textContent = n ? `Znaleziono ${n} ${plural(n, 'pozycję', 'pozycje', 'pozycji')}` : '';
    } else {
      searchInfo.hidden = true;
    }

    if (!state.entries.length) {
      listEl.innerHTML = '<div class="empty">Lista jest pusta.<br>Dodaj pierwszy przyjęty towar powyżej.</div>';
      return;
    }
    if (!dates.length) {
      listEl.innerHTML = `<div class="empty">Brak wyników dla „${esc(searchInput.value.trim())}”</div>`;
      return;
    }

    const visible = q ? dates : dates.slice(0, daysShown);
    let html = '';
    for (const date of visible) {
      const items = byDate.get(date).sort((a, b) => a.created - b.created);
      const all = q ? entriesOfDay(date) : items;
      html += `
      <section class="day">
        <div class="day-head">
          <div>
            <div class="day-title">${dayName(date)}</div>
            <div class="day-sub">${fmtDate(date)} · ${all.length} ${plural(all.length, 'pozycja', 'pozycje', 'pozycji')}${copyStatus(date)}</div>
          </div>
          <div class="day-actions">
            <button class="btn-copy" data-copy="${date}" type="button">${icoCopy}<span>Kopiuj</span></button>
            ${canShare ? `<button class="btn-share" data-share="${date}" type="button" aria-label="Udostępnij listę z ${fmtDate(date)}">${icoShare}</button>` : ''}
          </div>
        </div>
        <ul class="items">
          ${items.map((e) => `<li><button class="item" type="button" data-id="${e.id}">
            <span class="item-name">${q ? highlight(e.name, searchInput.value) : esc(e.name)}</span>
            <span class="item-qty">${fmtQty(e.qty)} <small>${esc(e.unit)}</small></span>${chev}
          </button></li>`).join('')}
        </ul>
      </section>`;
    }
    if (!q && dates.length > daysShown) {
      html += `<button class="more" id="moreBtn" type="button">Pokaż starsze dni (${dates.length - daysShown})</button>`;
    }
    listEl.innerHTML = html;
  }

  searchInput.addEventListener('input', render);
  searchClear.addEventListener('click', () => { searchInput.value = ''; render(); searchInput.focus(); });

  // ---------- Kopiowanie na Slacka ----------
  function slackText(date) {
    const items = entriesOfDay(date);
    return `Przyjęty towar z dnia: ${fmtDate(date)}\n\n` +
      items.map((e) => `• ${e.name} – ${fmtQty(e.qty)} ${e.unit}`).join('\n');
  }
  async function copyText(text) {
    try {
      if (navigator.clipboard && window.isSecureContext) { await navigator.clipboard.writeText(text); return true; }
    } catch (e) { /* spróbuj starszej metody */ }
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.setAttribute('readonly', '');
    ta.style.cssText = 'position:fixed;top:0;left:0;opacity:0;font-size:16px';
    document.body.appendChild(ta);
    ta.select();
    ta.setSelectionRange(0, text.length);
    let ok = false;
    try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
    ta.remove();
    return ok;
  }
  function markCopied(date) { state.copied[date] = { at: Date.now(), text: slackText(date) }; save(); }

  listEl.addEventListener('click', async (e) => {
    const copyBtn = e.target.closest('[data-copy]');
    if (copyBtn) {
      const date = copyBtn.dataset.copy;
      if (await copyText(slackText(date))) {
        markCopied(date);
        render();
        const b = listEl.querySelector(`[data-copy="${date}"]`);
        if (b) { b.classList.add('done'); b.querySelector('span').textContent = 'Skopiowano'; }
        toast('Skopiowano – wklej w Slacku');
      } else {
        toast('Nie udało się skopiować');
      }
      return;
    }
    const shareBtn = e.target.closest('[data-share]');
    if (shareBtn) {
      const date = shareBtn.dataset.share;
      try {
        await navigator.share({ text: slackText(date) });
        markCopied(date);
        render();
      } catch (err) { /* anulowano */ }
      return;
    }
    if (e.target.closest('#moreBtn')) { daysShown += DAYS_STEP; render(); return; }
    const item = e.target.closest('[data-id]');
    if (item) openEdit(item.dataset.id);
  });

  // ---------- Arkusze ----------
  function openSheet(ov) {
    ov.hidden = false;
    requestAnimationFrame(() => requestAnimationFrame(() => ov.classList.add('open')));
  }
  function closeSheet(ov) {
    ov.classList.remove('open');
    setTimeout(() => { ov.hidden = true; }, 220);
  }
  document.querySelectorAll('.overlay').forEach((ov) => {
    ov.addEventListener('click', (e) => { if (e.target === ov) closeSheet(ov); });
  });

  // ---------- Edycja ----------
  const editOv = $('editOverlay'), editName = $('editName'), editQty = $('editQty'), editDate = $('editDate');
  let editId = null, editUnit = 'szt.';
  const paintEditUnit = buildSeg($('editUnitSeg'), (u) => { editUnit = u; paintEditUnit(u); });

  function openEdit(id) {
    const e = state.entries.find((x) => x.id === id);
    if (!e) return;
    editId = id;
    editName.value = e.name;
    editQty.value = fmtQty(e.qty);
    editUnit = e.unit;
    paintEditUnit(editUnit);
    editDate.value = e.date;
    [editName, editQty].forEach((el) => el.classList.remove('invalid'));
    openSheet(editOv);
  }
  editQty.addEventListener('input', () => {
    let v = editQty.value.replace('.', ',').replace(/[^\d,]/g, '');
    const i = v.indexOf(',');
    if (i >= 0) v = v.slice(0, i + 1) + v.slice(i + 1).replace(/,/g, '');
    if (v !== editQty.value) editQty.value = v;
  });
  $('editCancel').addEventListener('click', () => closeSheet(editOv));
  $('editSave').addEventListener('click', () => {
    const e = state.entries.find((x) => x.id === editId);
    if (!e) return closeSheet(editOv);
    const name = editName.value.trim().replace(/\s+/g, ' ');
    const qty = parseQty(editQty.value);
    if (!name) { invalid(editName); return; }
    if (qty === null) { invalid(editQty); return; }
    Object.assign(e, { name, qty, unit: editUnit, date: /^\d{4}-\d{2}-\d{2}$/.test(editDate.value) ? editDate.value : e.date, updated: Date.now() });
    remember(name, editUnit, false);
    save();
    closeSheet(editOv);
    render();
    toast('Zapisano zmiany');
  });
  $('editDelete').addEventListener('click', () => {
    const e = state.entries.find((x) => x.id === editId);
    if (!e) return closeSheet(editOv);
    if (!confirm(`Usunąć „${e.name}” (${fmtQty(e.qty)} ${e.unit})?`)) return;
    state.entries = state.entries.filter((x) => x.id !== editId);
    save();
    closeSheet(editOv);
    render();
    toast('Usunięto pozycję');
  });

  // ---------- Menu: kopia zapasowa ----------
  const menuOv = $('menuOverlay');
  $('menuBtn').addEventListener('click', () => {
    const n = state.entries.length, k = Object.keys(state.dict).length;
    $('statsNote').textContent = `Zapisane pozycje: ${n} · zapamiętane nazwy: ${k}`;
    openSheet(menuOv);
  });
  $('menuClose').addEventListener('click', () => closeSheet(menuOv));

  $('exportBtn').addEventListener('click', async () => {
    const json = JSON.stringify({ app: 'przyjecia', version: 1, exported: new Date().toISOString(), ...state }, null, 1);
    const fname = `przyjecia-kopia-${todayISO()}.json`;
    try {
      const file = new File([json], fname, { type: 'application/json' });
      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        await navigator.share({ files: [file], title: fname });
        return;
      }
    } catch (e) {
      if (e && e.name === 'AbortError') return;
    }
    const url = URL.createObjectURL(new Blob([json], { type: 'application/json' }));
    const a = document.createElement('a');
    a.href = url; a.download = fname;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
  });

  $('importBtn').addEventListener('click', () => $('importFile').click());
  $('importFile').addEventListener('change', async (ev) => {
    const f = ev.target.files && ev.target.files[0];
    ev.target.value = '';
    if (!f) return;
    try {
      const data = JSON.parse(await f.text());
      if (!data || !Array.isArray(data.entries)) throw new Error('format');
      const have = new Set(state.entries.map((e) => e.id));
      const fresh = data.entries.filter((e) => e && e.id && !have.has(e.id) && e.name && e.date && parseQty(e.qty) !== null && UNITS.includes(e.unit));
      if (!confirm(`W pliku: ${data.entries.length} pozycji, nowych: ${fresh.length}.\nDołączyć je do listy?`)) return;
      state.entries.push(...fresh);
      for (const [k, d] of Object.entries(data.dict || {})) {
        const cur = state.dict[k];
        if (!cur || (d.count || 0) > (cur.count || 0)) state.dict[k] = d;
      }
      for (const [date, ts] of Object.entries(data.copied || {})) {
        if (!state.copied[date]) state.copied[date] = ts;
      }
      save();
      render();
      closeSheet(menuOv);
      toast(`Wczytano ${fresh.length} ${plural(fresh.length, 'pozycję', 'pozycje', 'pozycji')}`);
    } catch (e) {
      toast('To nie jest poprawny plik kopii');
    }
  });

  // ---------- Komunikat ----------
  let toastTimer;
  function toast(msg) {
    const t = $('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('show'), 2200);
  }

  // ---------- Start ----------
  function paintToday() {
    const s = new Date().toLocaleDateString('pl-PL', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
    $('todayLabel').textContent = s.charAt(0).toUpperCase() + s.slice(1);
  }
  paintToday();
  render();
  // po powrocie do aplikacji następnego dnia odśwież daty
  document.addEventListener('visibilitychange', () => { if (!document.hidden) { paintToday(); render(); } });

  if ('serviceWorker' in navigator && location.protocol !== 'file:') {
    navigator.serviceWorker.register('./sw.js').catch(() => {});
  }

  // do testów
  window.__przyjecia = { slackText, get state() { return state; } };
})();
</script>
</body>
</html>
